services:
  db:
    image: postgres:18-alpine@sha256:b6a16ed0eb96e2c362811f7eeb951eac8b459e7b40be4149ea5444aa7c65569b
    container_name: goro-postgres-prod
    cpu_shares: 1024
    oom_score_adj: -800
    restart: unless-stopped
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_HOST
      - POSTGRES_PORT
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data_prod:/var/lib/postgresql

  redis:
    image: redis:8.10.0-alpine@sha256:a6a88248ad5b0c724b7f2b380b7d21f46097db158b2b077ef85bcb97f90aee3a
    container_name: goro-redis-prod
    cpu_shares: 512
    oom_score_adj: -500
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data_prod:/data

  app:
    image: ghcr.io/mipselqq/goroutine:latest
    container_name: goro-goroutine-prod
    cpu_shares: 1024
    oom_score_adj: -900
    restart: unless-stopped
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_HOST
      - POSTGRES_PORT

      - REDIS_HOST
      - REDIS_PORT
      - REDIS_PASSWORD

      - APP_ENV
      - APP_LOG_LEVEL
      - APP_SWAGGER_HOST
      - APP_HOST
      - APP_PORT
      - APP_ADMIN_PORT
      - APP_JWT_SECRET
      - APP_ALLOWED_ORIGINS
      - APP_JWT_EXP

      - TELEGRAM_BOT_TOKEN
      - TELEGRAM_LINK_TOKEN_TTL
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - "127.0.0.1:${APP_PORT}:${APP_PORT}"

  notify:
    image: ghcr.io/mipselqq/goroutine:latest
    container_name: goro-notify-prod
    cpu_shares: 512
    oom_score_adj: -800
    restart: unless-stopped
    entrypoint: ["/notify"]
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_HOST
      - POSTGRES_PORT

      - NOTIFY_ENV
      - NOTIFY_LOG_LEVEL
    depends_on:
      app:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.13.2@sha256:1147c92841726a6fef55fe6124491d6f85480f8de204f7d420304ca5bbd0a8f7
    container_name: goro-prometheus-prod
    cpu_shares: 512
    oom_score_adj: 100
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.template.yml:/etc/prometheus/prometheus.template.yml:ro,Z
      - ./infra/prometheus/web-config.template.yml:/etc/prometheus/web-config.yml.template:ro,Z
      - prometheus_data_prod:/prometheus
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget --spider -q "http://$$PROMETHEUS_USER:$$PROMETHEUS_PASSWORD@localhost:9090/-/healthy"',
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      - APP_ADMIN_PORT
      - PROMETHEUS_USER
      - PROMETHEUS_PASSWORD
      - PROMETHEUS_BCRYPT_HASH
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        PROM_HASH_ESC=$$(printf '%s' "$$PROMETHEUS_BCRYPT_HASH" | sed 's/[\/&\\]/\\&/g') && \
        sed "s/\$${APP_ADMIN_PORT}/$$APP_ADMIN_PORT/g" /etc/prometheus/prometheus.template.yml > /etc/prometheus/prometheus.yml && \
        sed -e "s/\$${PROMETHEUS_USER}/$$PROMETHEUS_USER/g" -e "s/\$${PROMETHEUS_BCRYPT_HASH}/$$PROM_HASH_ESC/g" /etc/prometheus/web-config.yml.template > /etc/prometheus/web-config.yml && \
        /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.retention.time=15d \
          --web.enable-remote-write-receiver \
          --web.config.file=/etc/prometheus/web-config.yml

  grafana:
    image: grafana/grafana:13.2.0@sha256:95a8098fb092130e111b0264a9be4d3a2bd5405e5dba88d4b8f1f630b389614e
    container_name: goro-grafana-prod
    cpu_shares: 256
    oom_score_adj: 200
    environment:
      - GF_SECURITY_ADMIN_PASSWORD
      - PROMETHEUS_USER
      - PROMETHEUS_PASSWORD
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data_prod:/var/lib/grafana
      - ./infra/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./infra/grafana/dashboards:/etc/grafana/dashboards
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  node_exporter:
    image: prom/node-exporter:v1.12.1@sha256:da83fae85603c4e47e6c68369a7d746e2dda683dc35ea2e234b4f171e0d92798
    container_name: goro-node-exporter-prod
    cpu_shares: 128
    oom_score_adj: 500
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:9100/"]
      interval: 10s
      timeout: 5s
      retries: 3

  loki:
    image: grafana/loki:3.7.6@sha256:83c76da7858a8f4f88117ac521864ac33896fdae7a352a1df4068556e7513f64
    container_name: goro-loki-prod
    cpu_shares: 256
    oom_score_adj: 300
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data_prod:/loki
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 3

  alloy:
    image: grafana/alloy:v1.18.1@sha256:754409730f1a4ed9781f8a2ea3b6a8c55750ee125a267ecf8fb449f9a25c109a
    container_name: goro-alloy-prod
    cpu_shares: 128
    oom_score_adj: 400
    restart: unless-stopped
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data_prod:/var/lib/alloy/data
    command: run --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    user: root
    depends_on:
      - loki

volumes:
  postgres_data_prod:
  prometheus_data_prod:
  grafana_data_prod:
  loki_data_prod:
  alloy_data_prod:
  redis_data_prod:
